name: CI

# Cross-platform is a property you keep from day one, not one you add later:
# the native job builds + tests on macOS and Linux on every push. Windows is
# absent by decision (v1 platforms = macOS 14.4+ / Linux PipeWire — its virtual-
# device kernel-driver cost is commercial, not technical; feasibility §2, §4.2).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (typecheck · test · gates)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Gates run against the COMMITTED artifacts (no regeneration first), so a
      # stale generated header / ABI drift / stale bundle / hardcoded color fails
      # the build.
      # protocol:check RETIRED at the P3-0 flip, and its debt is recorded here
      # rather than hidden. It emitted `shell/generated/WZProtocol.h` from
      # WIZARD's schema, using exports (CHANNEL_BLOCK_FIELDS, DECK_BLOCK_FIELDS)
      # that scoopy's schema does not have — so with wizard's web deleted the
      # generator cannot run at all.
      #
      # ⚠️ WZProtocol.h is therefore FROZEN as committed, and its only consumers
      # — `wz_command` (CommandDispatch.cpp), `src/Main.cpp` and
      # `command_dispatch_test` — are ORPHANED: nothing links them but that test,
      # and they belonged to the `Wizard` app this flip removed. They should be
      # retired together, deliberately, rather than deleted in passing here.
      - run: npm run shared:check
      # The engine lock: scoopy's portable CORE is still vendored under
      # vendor/scoopy, hash-pinned (the web half moved in-tree at the P3-0 flip;
      # the core follows in step 2). Makes local edits to the vendored copy
      # loud, not forbidden.
      - run: npm run engine:check
      # The SL v3 track-param mapping is DERIVED from the pinned v2 ABI. This
      # fails if the vendored source moved and the mapping was not regenerated —
      # the one edit in this merge where a silent stale copy would write a value
      # into the wrong parameter.
      - run: npm run trackparams:check
      # The HotFrame layout is DERIVED from scoopy's pinned HOT_FRAME_SCALARS;
      # this fails if the schema moved and the 284-slot index header was not
      # regenerated — a mismatch would make every UI meter read a wrong slot.
      - run: npm run hotframe:check
      # The WorldTrack->engine-param rename is DERIVED from scoopy's worklet
      # field tables; fails if the worklet moved and the map was not regenerated.
      - run: npm run worldmap:check
      # abi:check RETIRED at the P3-0 flip. It asked "does wizard's engine carry
      # every param the schema declares?" — coherent while both were wizard's.
      # The schema is now SCOOPY's and `wz_engine` is the DONOR (SL-ABI-V3: "a
      # donor, not a survivor") that the merged app does not link, so the
      # question became a category error: all 29 params failed it. Twenty-nine
      # identical waivers would have been bookkeeping, not coverage.
      # The equivalent gate for the engine that ships is tape:check + the
      # hotframe/trackparams/worldmap codegen checks, which all still run.
      # The SL-ABI-V3 §5 tape transplant is CARRIED OR WAIVED, both directions:
      # fails if a wz_deck_* entry point was dropped without a reason, or an
      # sl_tape_* one was invented without one. A 21-function rename is exactly
      # where something falls off the end quietly.
      - run: npm run tape:check
      - run: npm run check:tokens
      - run: npm run webdist:check
      # scoopydist:check is GONE with the thing it policed. It existed to prove
      # `vendor/scoopy/webdist` — a vendored BUILD of another repo's UI — was
      # current, after a session's work was lost to a stale one. The web now
      # builds in-tree from `web/`, so `webdist:check` above covers it and there
      # is no second bundle to fall behind.

  native:
    name: native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      # JUCE gui modules (juce_gui_extra / WebBrowserComponent) need system
      # libraries on Linux; macOS provides its webview + audio natively.
      - name: Install JUCE Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev libcurl4-openssl-dev \
            libfreetype-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev libgtk-3-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
